name: Deploy site to Seohost (FTP)

on:
  # Automatyczne wdrazanie po push wlaczone ponownie 2026-08-09.
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files
        env:
          FTP_HOST: h50.seohost.pl
          FTP_USER: ${{ secrets.REMOTE_USER }}
          FTP_PASS: ${{ secrets.REMOTE_PASSWORD }}
        run: |
          FTP_USER="$(printf '%s' "$FTP_USER" | tr -d '\r\n\t ')"
          FTP_PASS="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          ok=0
          blad=0
          while IFS= read -r f; do
            rel="${f#./}"
            echo "Wysylam: $rel"
            if curl -sS --connect-timeout 15 --max-time 120 --retry 3 --retry-delay 5 \
                 --ftp-create-dirs -T "$f" \
                 --user "$FTP_USER:$FTP_PASS" \
                 "ftp://$FTP_HOST/$rel"; then
              ok=$((ok+1))
            else
              echo "BLAD przy $rel"
              blad=$((blad+1))
            fi
          done < <(find . -type f ! -path "./.git/*" ! -path "./.github/*" ! -path "./.claude/*" ! -name "CLAUDE.md" ! -name ".gitignore" ! -name "deploy-lokalny.ps1" ! -name "ftp-haslo.txt")
          echo "Wyslane: $ok, bledy: $blad"
          [ "$blad" -eq 0 ]
