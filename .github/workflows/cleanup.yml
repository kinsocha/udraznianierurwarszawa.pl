name: Usun pliki strony z serwera (jednorazowo)

on:
  push:
    branches: ["main"]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Skasuj pliki strony przez FTP
        env:
          FTP_HOST: h50.seohost.pl
          FTP_USER: ${{ secrets.REMOTE_USER }}
          FTP_PASS: ${{ secrets.REMOTE_PASSWORD }}
        run: |
          FTP_USER="$(printf '%s' "$FTP_USER" | tr -d '\r\n\t ')"
          FTP_PASS="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          echo "Kasuje pliki strony..."
          curl -sS --connect-timeout 15 --max-time 60 --user "$FTP_USER:$FTP_PASS" \
            -Q "*DELE index.html" \
            -Q "*DELE css/style.css" \
            -Q "*DELE img/placeholder-hero.svg" \
            -Q "*DELE img/placeholder-autor.svg" \
            -Q "*RMD css" \
            -Q "*RMD img" \
            --list-only "ftp://$FTP_HOST/"
          echo "--- powyzej zawartosc katalogu po kasowaniu ---"
